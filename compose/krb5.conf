# The OpenBao container's Kerberos configuration: an explicit KDC, so nothing here depends on
# DNS at all. Mounted at /etc/krb5.conf.
[libdefaults]
    default_realm = EXAMPLE.COM
    dns_lookup_realm = false
    dns_lookup_kdc = false

[realms]
    EXAMPLE.COM = {
        kdc = kdc.example.com
    }

[domain_realm]
    .example.com = EXAMPLE.COM
    example.com = EXAMPLE.COM
